<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Support Survey | INMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Barlow', sans-serif; background-color: #FFFFFF; color: #1A1A2E; }
    button { font-family: 'Barlow Semi Condensed', sans-serif; }
    textarea { font-family: 'Barlow', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    const COLORS = {
      navy: "#002060",
      blue: "#00417B",
      gold: "#FFBA08",
      white: "#FFFFFF",
      lightBg: "#F0F4F8",
      text: "#1A1A2E",
      textLight: "#4A5568",
      border: "#CBD5E0",
    };

    const sections = [
      {
        id: "barriers",
        title: "What's Getting in the Way",
        subtitle: "We want to support you in finding your place.",
        questions: [
          {
            id: "heldBack",
            text: "Have you held back from volunteering for something? What got in the way?",
            type: "multi",
            options: [
              "I wasn't sure what the role involved day-to-day",
              "I was worried about being asked to do more than I signed up for",
              "I didn't want to commit and then not follow through",
              "I wasn't sure I'd be good at it",
              "I wanted training but didn't want to seem like I was volunteering by asking",
              "The time or location didn't work for me",
              "I just haven't found the right fit yet",
            ],
          },
          {
            id: "training",
            text: "If training were available, what would make you more likely to attend?",
            type: "multi",
            options: [
              "Knowing that attending doesn't commit me to anything",
              "A short session (under an hour)",
              "Watching someone else do it first before I try",
              "Going with a friend or partner",
              "Having a specific, limited task to try afterward",
              "Written materials I can review on my own time",
            ],
          },
          {
            id: "promises",
            text: "Which of these would you want the group to promise?",
            type: "multi",
            options: [
              "You can try a role once with no obligation to continue",
              "You can say no to any specific ask without explanation",
              "Your preferences from this survey will be respected",
              "Someone will check in with you after your first experience",
            ],
          },
        ],
      },
      {
        id: "skills",
        title: "What You Bring",
        subtitle: "Skills you have that the group might not know about.",
        questions: [
          {
            id: "skillAreas",
            text: "Which of these can you do, or would you like to learn? Select all that apply.",
            type: "multi",
            options: [
              "Writing or editing (newsletters, emails, social posts, talking points)",
              "Graphic design or visual materials (flyers, signs, handouts)",
              "Data, spreadsheets, or tracking results",
              "Event planning and logistics",
              "Training or coaching other volunteers",
              "Social media management",
              "Research (finding events, vetting information)",
              "Photography or documentation",
              "Translation or interpretation",
              "Providing food, supplies, or materials for events",
              "Giving rides to volunteers or voters",
              "Instructional design or creating learning materials",
            ],
          },
          {
            id: "skillLevel",
            text: "For the skills you selected, how would you describe your experience?",
            type: "single",
            options: [
              "I do this professionally or have significant experience",
              "I'm capable and have done it before",
              "I'm willing to learn",
              "It depends on the skill \u2014 a mix of the above",
            ],
          },
          {
            id: "hiddenSkill",
            text: "Is there something you're good at that isn't listed above?",
            type: "freetext",
          },
        ],
      },
    ];

    function ProgressBar({ current, total }) {
      const pct = ((current + 1) / total) * 100;
      return (
        <div style={{ width: "100%", height: 6, backgroundColor: COLORS.border, borderRadius: 3, marginBottom: 32 }}>
          <div style={{ width: pct + "%", height: "100%", backgroundColor: COLORS.gold, borderRadius: 3, transition: "width 0.3s ease" }} />
        </div>
      );
    }

    function Question({ question, answer, onChange }) {
      if (question.type === "freetext") {
        return (
          <div style={{ marginBottom: 32 }}>
            <p style={{ fontSize: 17, fontWeight: 600, color: COLORS.navy, marginBottom: 12, lineHeight: 1.4, fontFamily: "'Barlow Semi Condensed', 'Barlow', sans-serif" }}>
              {question.text}
            </p>
            <textarea
              value={answer || ""}
              onChange={(e) => onChange(e.target.value)}
              placeholder="Optional \u2014 tell us in your own words"
              style={{
                width: "100%", minHeight: 80, padding: "12px 16px",
                border: "2px solid " + COLORS.border, borderRadius: 8,
                fontSize: 15, fontFamily: "'Barlow', sans-serif",
                color: COLORS.text, resize: "vertical", boxSizing: "border-box",
              }}
            />
          </div>
        );
      }

      const isSingle = question.type === "single";
      const selected = answer || (isSingle ? null : []);

      const handleSelect = (option) => {
        if (isSingle) {
          onChange(option);
        } else {
          const arr = Array.isArray(selected) ? selected : [];
          if (arr.includes(option)) {
            onChange(arr.filter((o) => o !== option));
          } else {
            onChange([...arr, option]);
          }
        }
      };

      return (
        <div style={{ marginBottom: 32 }}>
          <p style={{ fontSize: 17, fontWeight: 600, color: COLORS.navy, marginBottom: 4, lineHeight: 1.4, fontFamily: "'Barlow Semi Condensed', 'Barlow', sans-serif" }}>
            {question.text}
          </p>
          {!isSingle && (
            <p style={{ fontSize: 13, color: COLORS.textLight, marginBottom: 12, marginTop: 0 }}>Select all that apply</p>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: isSingle ? 12 : 0 }}>
            {question.options.map((option) => {
              const isSelected = isSingle ? selected === option : Array.isArray(selected) && selected.includes(option);
              return (
                <button
                  key={option}
                  onClick={() => handleSelect(option)}
                  style={{
                    display: "flex", alignItems: "flex-start", gap: 12,
                    padding: "12px 16px",
                    border: "2px solid " + (isSelected ? COLORS.blue : COLORS.border),
                    borderRadius: 8,
                    backgroundColor: isSelected ? "#E8EEF4" : COLORS.white,
                    cursor: "pointer", textAlign: "left", fontSize: 15,
                    lineHeight: 1.4, color: COLORS.text,
                    fontFamily: "'Barlow', sans-serif",
                    transition: "all 0.15s ease",
                  }}
                >
                  <span style={{
                    width: 20, height: 20, minWidth: 20,
                    borderRadius: isSingle ? "50%" : 4,
                    border: "2px solid " + (isSelected ? COLORS.blue : COLORS.border),
                    backgroundColor: isSelected ? COLORS.blue : "transparent",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    marginTop: 1, transition: "all 0.15s ease",
                  }}>
                    {isSelected && (
                      <svg width="12" height="12" viewBox="0 0 12 12">
                        <path d="M2.5 6L5 8.5L9.5 4" stroke="white" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                      </svg>
                    )}
                  </span>
                  <span>{option}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function ResultsView({ answers }) {
      const barriers = answers.heldBack || [];
      const promises = answers.promises || [];
      const training = answers.training || [];
      const skills = answers.skillAreas || [];
      const skillLevel = answers.skillLevel || "";
      const hiddenSkill = answers.hiddenSkill || "";

      const skillLabels = {
        "Writing or editing (newsletters, emails, social posts, talking points)": "Writing & Editing",
        "Graphic design or visual materials (flyers, signs, handouts)": "Design & Visual Materials",
        "Data, spreadsheets, or tracking results": "Data & Tracking",
        "Event planning and logistics": "Event Planning",
        "Training or coaching other volunteers": "Training & Coaching",
        "Social media management": "Social Media",
        "Research (finding events, vetting information)": "Research",
        "Photography or documentation": "Photography & Documentation",
        "Translation or interpretation": "Translation",
        "Providing food, supplies, or materials for events": "Supplies & Materials",
        "Giving rides to volunteers or voters": "Transportation",
        "Instructional design or creating learning materials": "Instructional Design & Learning Materials",
      };

      return (
        <div>
          <div style={{ backgroundColor: COLORS.navy, borderRadius: 12, padding: "32px 32px", marginBottom: 32, textAlign: "center" }}>
            <h1 style={{ fontSize: 24, fontWeight: 800, color: COLORS.gold, margin: "0 0 8px 0", fontFamily: "'Barlow Semi Condensed', sans-serif" }}>
              What We Learned
            </h1>
            <p style={{ fontSize: 15, color: COLORS.white, margin: 0, opacity: 0.9 }}>
              Here's what you told us. This helps the group meet you where you are.
            </p>
          </div>

          {barriers.length > 0 && (
            <div style={{ padding: "20px 24px", backgroundColor: "#FFF8E1", borderRadius: 8, border: "1px solid " + COLORS.gold, marginBottom: 20 }}>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: COLORS.navy, margin: "0 0 12px 0", fontFamily: "'Barlow Semi Condensed', sans-serif" }}>
                What's been in the way
              </h3>
              {barriers.map((b) => (
                <p key={b} style={{ fontSize: 14, color: COLORS.text, margin: "0 0 6px 0", paddingLeft: 12, fontFamily: "'Barlow', sans-serif", lineHeight: 1.5 }}>
                  \u2022 {b}
                </p>
              ))}
            </div>
          )}

          {training.length > 0 && (
            <div style={{ padding: "20px 24px", backgroundColor: "#E8EEF4", borderRadius: 8, marginBottom: 20 }}>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: COLORS.navy, margin: "0 0 12px 0", fontFamily: "'Barlow Semi Condensed', sans-serif" }}>
                What would make training easier
              </h3>
              {training.map((t) => (
                <p key={t} style={{ fontSize: 14, color: COLORS.text, margin: "0 0 6px 0", paddingLeft: 12, fontFamily: "'Barlow', sans-serif", lineHeight: 1.5 }}>
                  \u2713 {t}
                </p>
              ))}
            </div>
          )}

          {promises.length > 0 && (
            <div style={{ padding: "20px 24px", backgroundColor: "#FFF8E1", borderRadius: 8, border: "1px solid " + COLORS.gold, marginBottom: 20 }}>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: COLORS.navy, margin: "0 0 12px 0", fontFamily: "'Barlow Semi Condensed', sans-serif" }}>
                What you'd like the group to promise
              </h3>
              {promises.map((p) => (
                <p key={p} style={{ fontSize: 14, color: COLORS.text, margin: "0 0 6px 0", paddingLeft: 12, fontFamily: "'Barlow', sans-serif", lineHeight: 1.5 }}>
                  \u2713 {p}
                </p>
              ))}
            </div>
          )}

          {skills.length > 0 && (
            <div style={{ padding: "20px 24px", backgroundColor: "#E8EEF4", borderRadius: 8, marginBottom: 20 }}>
              <h3 style={{ fontSize: 16, fontWeight: 700, color: COLORS.navy, margin: "0 0 4px 0", fontFamily: "'Barlow Semi Condensed', sans-serif" }}>
                Skills you bring
              </h3>
              {skillLevel && (
                <p style={{ fontSize: 13, color: COLORS.textLight, margin: "0 0 12px 0", fontStyle: "italic", fontFamily: "'Barlow', sans-serif" }}>
                  Self-assessed level: {skillLevel.toLowerCase()}
                </p>
              )}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {skills.map((s) => (
                  <span
                    key={s}
                    style={{
                      display: "inline-block", padding: "6px 14px",
                      backgroundColor: COLORS.white,
                      border: "1px solid " + COLORS.blue,
                      borderRadius: 20, fontSize: 13, fontWeight: 600,
                      color: COLORS.blue,
                      fontFamily: "'Barlow Semi Condensed', sans-serif",
                    }}
                  >
                    {skillLabels[s] || s}
                  </span>
                ))}
              </div>
              {hiddenSkill && (
                <p style={{ fontSize: 14, color: COLORS.text, marginTop: 12, marginBottom: 0, fontFamily: "'Barlow', sans-serif", lineHeight: 1.5 }}>
                  Also: "{hiddenSkill}"
                </p>
              )}
            </div>
          )}

          <div style={{ padding: "20px 24px", backgroundColor: COLORS.navy, borderRadius: 8, marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, fontWeight: 700, color: COLORS.gold, margin: "0 0 8px 0", fontFamily: "'Barlow Semi Condensed', sans-serif", textTransform: "uppercase", letterSpacing: "0.08em" }}>
              For group leaders
            </h3>
            <p style={{ fontSize: 14, color: COLORS.white, margin: 0, lineHeight: 1.6, fontFamily: "'Barlow', sans-serif" }}>
              In the deployed version, these individual results aggregate into a dashboard. You'd see how many members selected each barrier, which promises matter most, and what skills exist across the group that haven't been tapped. That data turns a repeated ask into a targeted conversation.
            </p>
          </div>
        </div>
      );
    }

    function App() {
      const [currentSection, setCurrentSection] = useState(-1);
      const [answers, setAnswers] = useState({});
      const [showResults, setShowResults] = useState(false);

      const handleAnswer = (questionId, value) => {
        setAnswers((prev) => ({ ...prev, [questionId]: value }));
      };

      const currentQuestions = currentSection >= 0 ? sections[currentSection].questions : [];
      const requiredAnswered = currentSection >= 0 && currentQuestions.every((q) => {
        if (q.type === "freetext") return true;
        if (q.type === "single") return answers[q.id] != null;
        return true;
      });

      const handleNext = () => {
        if (currentSection < sections.length - 1) {
          setCurrentSection(currentSection + 1);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          setShowResults(true);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };

      const handleBack = () => {
        if (showResults) {
          setShowResults(false);
          setCurrentSection(sections.length - 1);
        } else if (currentSection > 0) {
          setCurrentSection(currentSection - 1);
        } else if (currentSection === 0) {
          setCurrentSection(-1);
        }
      };

      const handleRestart = () => {
        setAnswers({});
        setCurrentSection(-1);
        setShowResults(false);
      };

      if (currentSection === -1) {
        return (
          <div style={{ maxWidth: 640, margin: "0 auto", padding: "40px 24px", fontFamily: "'Barlow', sans-serif" }}>
            <div style={{ backgroundColor: COLORS.navy, borderRadius: 12, padding: "40px 32px", marginBottom: 32, textAlign: "center" }}>
              <h1 style={{ fontSize: 28, fontWeight: 800, color: COLORS.gold, margin: "0 0 8px 0", fontFamily: "'Barlow Semi Condensed', sans-serif", letterSpacing: "0.02em" }}>
                Help Us Help You
              </h1>
              <p style={{ fontSize: 15, color: COLORS.white, margin: 0, opacity: 0.9 }}>
                A companion to the volunteer preference survey
              </p>
            </div>
            <p style={{ fontSize: 16, lineHeight: 1.6, color: COLORS.text, marginBottom: 16 }}>
              This short companion survey helps us support you in finding your place in the work between now and November. We want to know what you're good at and whether anything has made it harder to step in.
            </p>
            <p style={{ fontSize: 16, lineHeight: 1.6, color: COLORS.text, marginBottom: 16 }}>
              We need everyone contributing through November in a role that fits. Matching people to their strengths produces better results and prevents burnout. Two minutes here helps us put you where you'll have the most impact and stay the longest.
            </p>
            <p style={{
              fontSize: 15, lineHeight: 1.6, color: COLORS.blue, fontWeight: 600,
              marginBottom: 32, padding: "16px 20px", backgroundColor: "#E8EEF4", borderRadius: 8,
            }}>
              Your answers are confidential to group leadership. Completing this does not commit you to anything you haven't already chosen.
            </p>
            <button
              onClick={() => setCurrentSection(0)}
              style={{
                width: "100%", padding: "16px 24px", backgroundColor: COLORS.navy, color: COLORS.white,
                border: "none", borderRadius: 8, fontSize: 17, fontWeight: 700, cursor: "pointer",
                fontFamily: "'Barlow Semi Condensed', sans-serif", letterSpacing: "0.02em",
              }}
            >
              Get Started
            </button>
          </div>
        );
      }

      if (showResults) {
        return (
          <div style={{ maxWidth: 640, margin: "0 auto", padding: "40px 24px", fontFamily: "'Barlow', sans-serif" }}>
            <ResultsView answers={answers} />
            <button
              onClick={handleRestart}
              style={{
                width: "100%", padding: "14px 24px", backgroundColor: "transparent", color: COLORS.blue,
                border: "2px solid " + COLORS.blue, borderRadius: 8, fontSize: 15, fontWeight: 600,
                cursor: "pointer", fontFamily: "'Barlow Semi Condensed', sans-serif",
              }}
            >
              Start Over
            </button>
          </div>
        );
      }

      const section = sections[currentSection];
      return (
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "40px 24px", fontFamily: "'Barlow', sans-serif" }}>
          <ProgressBar current={currentSection} total={sections.length} />
          <div style={{ marginBottom: 32 }}>
            <h2 style={{ fontSize: 22, fontWeight: 800, color: COLORS.navy, margin: "0 0 4px 0", fontFamily: "'Barlow Semi Condensed', sans-serif" }}>
              {section.title}
            </h2>
            <p style={{ fontSize: 15, color: COLORS.textLight, margin: 0 }}>{section.subtitle}</p>
          </div>
          {section.questions.map((q) => (
            <Question key={q.id} question={q} answer={answers[q.id]} onChange={(val) => handleAnswer(q.id, val)} />
          ))}
          <div style={{ display: "flex", gap: 12, marginTop: 16 }}>
            <button
              onClick={handleBack}
              style={{
                padding: "14px 24px", backgroundColor: "transparent", color: COLORS.textLight,
                border: "1px solid " + COLORS.border, borderRadius: 8, fontSize: 15, fontWeight: 600,
                cursor: "pointer", fontFamily: "'Barlow Semi Condensed', sans-serif",
              }}
            >
              Back
            </button>
            <button
              onClick={handleNext}
              disabled={!requiredAnswered}
              style={{
                flex: 1, padding: "14px 24px",
                backgroundColor: requiredAnswered ? COLORS.navy : COLORS.border,
                color: requiredAnswered ? COLORS.white : COLORS.textLight,
                border: "none", borderRadius: 8, fontSize: 15, fontWeight: 700,
                cursor: requiredAnswered ? "pointer" : "not-allowed",
                fontFamily: "'Barlow Semi Condensed', sans-serif", transition: "all 0.15s ease",
              }}
            >
              {currentSection === sections.length - 1 ? "See Results" : "Next"}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
